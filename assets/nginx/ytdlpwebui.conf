# yt-dlp Web UI for TOS 7 — nginx 反代（WebUI External Open / 新标签页模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/ytdlpwebui/nginx/ytdlpwebui.conf
# 平台将其加载进 TOS nginx；location 前缀必须与 config.ini 的 path 一致
#
# 剥离前缀转发：上游前端经 TOS 补丁（patches/0001-tos-mount-prefix.patch）
# 从 window.location.pathname 推导挂载前缀，REST / RPC / WebSocket 全部
# 发往 /ytdlpwebui/...，所以这里用尾斜杠 proxy_pass 把前缀去掉后交给
# 仅监听 127.0.0.1:13033 的后端（前端资源、哈希路由、文件下载全部自洽）。
location /ytdlpwebui/ {
    proxy_pass http://127.0.0.1:13033/;
    proxy_http_version 1.1;
    # Host 用 $http_host（含端口）：避免任何由后端生成的绝对 URL 丢端口
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（RPC /rpc/ws 实时进度推送必需）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 下载/预览长耗时，放宽超时
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    # 大文件流式传输不缓冲（边下边播、文件直吐）
    proxy_buffering off;
    proxy_request_buffering off;
}
# 隐私政策（审核 C3）：精确匹配优先于前缀反代，直接从安装目录回静态文件
location = /ytdlpwebui/privacy-policy.html {
    alias /usr/local/ytdlpwebui/privacy-policy.html;
    default_type text/html;
}
# 无尾斜杠访问补一个 301（用户手输地址的容错）
# absolute_redirect off: 输出相对 Location，避免 TOS nginx 构造绝对 URL 时
# 丢失端口（实测 port_in_redirect 环境下会踢到 80 端口）
location = /ytdlpwebui {
    absolute_redirect off;
    return 301 /ytdlpwebui/;
}
